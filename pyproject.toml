[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisdiff"
version = "0.1.0"
description = "Zero-Cost Autonomous AppSec Triage Engine"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tree-sitter>=0.21,<0.22",
    "tree-sitter-languages>=1.10",
    "sentry-sdk>=2.0",
    "PyJWT[cryptography]>=2.8",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "respx>=0.21",
    "ruff>=0.4",
    "httpx>=0.27",
    "tree-sitter>=0.21,<0.22",
    "tree-sitter-languages>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aegisdiff*"]

[project.scripts]
aegisdiff = "aegisdiff.entrypoint:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=aegisdiff --cov-report=term-missing"
