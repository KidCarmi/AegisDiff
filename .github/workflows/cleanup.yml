name: AegisDiff — DB Cleanup (90-day retention)

on:
  schedule:
    - cron: "0 2 * * *"   # Daily at 2am UTC
  workflow_dispatch: {}    # Allow manual trigger

permissions:
  contents: none           # No repo access needed

jobs:
  cleanup:
    name: Purge old scan records
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Trigger cleanup on Vercel
        env:
          AEGISDIFF_INGEST_URL: ${{ secrets.AEGISDIFF_INGEST_URL }}
          # CRON_SECRET must match the CRON_SECRET env var set in Vercel.
          # Store it in GitHub secrets as AEGISDIFF_CLEANUP_SECRET.
          AEGISDIFF_CLEANUP_SECRET: ${{ secrets.AEGISDIFF_CLEANUP_SECRET }}
        run: |
          if [ -z "$AEGISDIFF_INGEST_URL" ]; then
            echo "No ingest URL configured — skipping cleanup"
            exit 0
          fi
          if [ -z "$AEGISDIFF_CLEANUP_SECRET" ]; then
            echo "No AEGISDIFF_CLEANUP_SECRET configured — skipping cleanup"
            exit 0
          fi
          CLEANUP_URL="${AEGISDIFF_INGEST_URL%/ingest}/admin/cleanup"
          curl -s -X POST "$CLEANUP_URL" \
            -H "Authorization: Bearer $AEGISDIFF_CLEANUP_SECRET" \
            -H "Content-Type: application/json" \
            --fail \
            && echo "Cleanup triggered successfully" \
            || echo "Cleanup request failed (non-fatal)"
