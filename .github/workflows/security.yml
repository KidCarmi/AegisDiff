name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Every Monday 06:00 UTC

permissions:
  contents: read
  security-events: write # required to upload SARIF to GitHub Security tab

jobs:
  # ── 1. Secret scanning ─────────────────────────────────────────────────────
  gitleaks:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so Gitleaks can scan all commits

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # optional — only needed for org-level scanning

  # ── 2. SAST — Python + TypeScript (Semgrep, replaces CodeQL) ───────────────
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep scan
        run: |
          semgrep scan \
            --config "p/python" \
            --config "p/nodejs" \
            --config "p/typescript" \
            --config "p/owasp-top-ten" \
            --config "p/secrets" \
            --config "p/jwt" \
            --sarif \
            --output semgrep.sarif \
            --error
        continue-on-error: true # upload results even on findings

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
        if: always()

  # ── 3. SAST — Python-specific (Bandit) ─────────────────────────────────────
  bandit:
    name: SAST Python (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Bandit
        run: pip install bandit[sarif]

      - name: Run Bandit
        run: |
          bandit -r aegisdiff/ \
            -f sarif \
            -o bandit.sarif \
            --severity-level medium \
            --confidence-level medium || true

      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit
        if: always()

  # ── 4. SCA — dependency vulnerabilities (Trivy) ────────────────────────────
  trivy:
    name: SCA (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan (Python + npm)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: 0 # don't fail — upload findings

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy
        if: always()

      # Quick human-readable summary in the workflow log
      - name: Trivy table summary
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1 # fail the job if HIGH/CRITICAL deps found
        continue-on-error: true

  # ── 5. npm audit (Node.js web dashboard) ───────────────────────────────────
  npm-audit:
    name: SCA npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --ignore-scripts

      - name: npm audit (high+)
        run: npm audit --audit-level=high --json | tee npm-audit.json || true

      - name: Summarise audit
        run: |
          node -e "
            const a = require('./npm-audit.json');
            const vulns = a.vulnerabilities ?? {};
            const high = Object.values(vulns).filter(v => ['high','critical'].includes(v.severity)).length;
            console.log('High/Critical npm vulns:', high);
            if (high > 0) process.exit(1);
          " || true

  # ── 6. pip-audit (Python engine) ───────────────────────────────────────────
  pip-audit:
    name: SCA pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install pip-audit

      - name: pip-audit
        run: |
          pip install -e . --quiet
          pip-audit --format=json --output pip-audit.json || true
          pip-audit --format=columns || true
