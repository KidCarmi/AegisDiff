name: Integration Test — End-User PR Scan

# Smoke test that verifies AegisDiff works exactly as a real user experiences it:
#
#   1. Opens a real PR with vulnerable code on a connected test repo
#   2. Waits for AegisDiff to scan it automatically
#      (webhook → Vercel → repository_dispatch → aegisdiff-app.yml → engine)
#   3. Verifies the PR comment + commit status appeared on GitHub
#   4. Optionally verifies the scan is stored in the Vercel dashboard
#
# The test runner never calls the engine directly.
# It just acts like a developer who opened a PR and is watching their screen.
#
# ── One-time setup (5 minutes) ──────────────────────────────────────────────
#
#   1. Create a test repo, e.g. KidCarmi/aegisdiff-integration-target
#   2. Sign in to the AegisDiff dashboard → connect that repo
#      (this installs the GitHub App + registers the webhook automatically)
#   3. Add 2 required secrets to KidCarmi/AegisDiff:
#
#      INTEGRATION_TEST_GITHUB_TOKEN  — GitHub PAT with `repo` scope on the test repo
#      INTEGRATION_TEST_REPO          — "owner/name" of the test repo
#
#   Optional — to also verify the dashboard stored the scan:
#      INTEGRATION_DASHBOARD_URL      — https://your-app.vercel.app
#      INTEGRATION_API_KEY            — v1 REST API key (from GET /api/v1/key)

on:
  # Weekly canary — every Monday at 08:00 UTC
  schedule:
    - cron: "0 8 * * 1"

  # Manual trigger from the Actions tab
  workflow_dispatch:

  # Run when the engine or this workflow changes
  push:
    paths:
      - "aegisdiff/**"
      - ".github/workflows/integration-test.yml"
      - "tests/test_integration_real_github.py"
    branches:
      - main
      - master
      - "claude/**"

permissions:
  contents: read   # checkout only — no engine credentials needed

jobs:
  end-user-scan:
    name: End-User PR Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20   # 8-min scan timeout + buffer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: pip install --quiet httpx pytest pytest-timeout

      - name: Run end-user integration test
        env:
          # Required — the only two secrets needed
          INTEGRATION_TEST_GITHUB_TOKEN: ${{ secrets.INTEGRATION_TEST_GITHUB_TOKEN }}
          INTEGRATION_TEST_REPO:         ${{ secrets.INTEGRATION_TEST_REPO }}

          # Optional — enables Vercel dashboard read-back verification
          INTEGRATION_DASHBOARD_URL:     ${{ secrets.INTEGRATION_DASHBOARD_URL }}
          INTEGRATION_API_KEY:           ${{ secrets.INTEGRATION_API_KEY }}

        run: |
          python -m pytest tests/test_integration_real_github.py \
            -v -s \
            --timeout=600 \
            --tb=short \
            --no-header \
            -p no:cov

      - name: Write step summary
        if: always()
        run: |
          echo "## End-User Integration Test" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test repo | \`${{ secrets.INTEGRATION_TEST_REPO }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | ${{ github.event_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dashboard check | ${{ secrets.INTEGRATION_DASHBOARD_URL != '' && '✓ enabled' || 'skipped' }} |" >> "$GITHUB_STEP_SUMMARY"
