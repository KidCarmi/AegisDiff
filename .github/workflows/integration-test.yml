name: Integration Test — End-User PR Scan

# Smoke test that verifies AegisDiff works exactly as a real user experiences it.
#
# ZERO secrets required — GITHUB_TOKEN and GITHUB_REPOSITORY are injected
# automatically by GitHub Actions into every run. No setup needed.
#
# Flow:
#   1. Opens a real PR with vulnerable code on this repo
#   2. Waits for AegisDiff to scan it automatically
#      (webhook → Vercel → repository_dispatch → aegisdiff-app.yml → engine)
#   3. Verifies the PR comment and commit status appeared
#   4. Closes the PR and deletes the test branch
#
# Optional — to also verify the Vercel dashboard stored the scan:
#   Add these 2 secrets once (Settings → Secrets → Actions):
#     INTEGRATION_DASHBOARD_URL  — https://your-app.vercel.app
#     INTEGRATION_API_KEY        — v1 REST API key (from GET /api/v1/key)

on:
  schedule:
    - cron: "0 8 * * 1"   # weekly canary — Monday 08:00 UTC
  workflow_dispatch:       # manual run from Actions tab
  push:
    paths:
      - "aegisdiff/**"
      - ".github/workflows/integration-test.yml"
      - "tests/test_integration_real_github.py"
    branches:
      - main
      - master
      - "claude/**"

permissions:
  contents: write       # create test branch + file
  pull-requests: write  # open and close the test PR
  statuses: read        # read commit statuses to verify AegisDiff posted one

jobs:
  end-user-scan:
    name: End-User PR Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20   # 8-min scan wait + buffer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        # Only needs httpx and pytest — no coverage tooling required here.
        run: pip install --quiet httpx pytest pytest-timeout

      - name: Run end-user integration test
        env:
          # Auto-injected by GitHub Actions — no secrets to add
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

          # Optional: Vercel dashboard read-back verification
          INTEGRATION_DASHBOARD_URL: ${{ secrets.INTEGRATION_DASHBOARD_URL }}
          INTEGRATION_API_KEY:       ${{ secrets.INTEGRATION_API_KEY }}

        # --override-ini clears the --cov addopts from pyproject.toml
        # so pytest-cov is not required in this lightweight install
        run: |
          python -m pytest tests/test_integration_real_github.py \
            -v -s \
            --timeout=600 \
            --tb=short \
            --no-header \
            --override-ini="addopts="

      - name: Write step summary
        if: always()
        run: |
          echo "## End-User Integration Test" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repo | \`${{ github.repository }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | ${{ github.event_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dashboard check | ${{ secrets.INTEGRATION_DASHBOARD_URL != '' && '✓ enabled' || 'skipped (no secret set)' }} |" >> "$GITHUB_STEP_SUMMARY"
