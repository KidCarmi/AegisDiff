name: CI

on:
  push:
    branches: [main, master, develop, "claude/**"]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write   # Required for GitHub OIDC — lets CI auth to ingest without secrets

jobs:
  # ── Job 1: unit tests + lint ──────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install --quiet -e .[dev]

      - name: Lint (ruff)
        run: ruff check aegisdiff/

      - name: Format check (ruff)
        run: ruff format --check aegisdiff/

      - name: Run tests
        run: pytest --tb=short -q

  # ── Job 2: canary — always scan the known-vulnerable fixture ─────────────
  # Sends a real scan result to the dashboard on every push so the GUI always
  # has data. Expected verdict: TRUE_POSITIVE (SQLi in sample.diff).
  # continue-on-error keeps CI green — this is a metric, not a gate.
  canary:
    name: Canary Scan (fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install AegisDiff
        run: pip install --quiet -e .[dev]

      - name: Get OIDC token for ingest auth
        id: oidc
        run: |
          OIDC_TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=aegisdiff" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          echo "token=$OIDC_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run canary scan (sample.diff — known SQLi)
        continue-on-error: true   # Metric only — never blocks CI
        env:
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2:       ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3:       ${{ secrets.GROQ_API_KEY_3 }}
          COMMIT_SHA:           ${{ github.sha }}
          REPO:                 ${{ github.repository }}
          DIFF_PATH:            tests/fixtures/sample.diff
          AEGISDIFF_INGEST_URL: ${{ secrets.AEGISDIFF_INGEST_URL }}
          AEGISDIFF_REPO_TOKEN: ${{ steps.oidc.outputs.token }}
        run: python -m aegisdiff.entrypoint

      - name: Write step summary
        if: always()
        run: |
          echo "### Canary Scan — \`tests/fixtures/sample.diff\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Expected: **TRUE_POSITIVE** (SQLi + cmd injection)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/step_summary.md ]; then
            cat /tmp/step_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Job 3: dogfood — scan this PR's own diff ──────────────────────────────
  appsec:
    name: AppSec Self-Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only run when LLM keys are available (skips forks without secrets)
    if: >
      (github.event_name == 'pull_request' ||
       github.event_name == 'push') &&
      vars.AEGISDIFF_SELF_SCAN != 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install AegisDiff
        run: pip install --quiet -e .[dev]

      - name: Generate diff
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          timeout 60 git diff "${BASE_SHA}...${HEAD_SHA}" \
            -- "*.py" "*.js" "*.ts" "*.tsx" "*.jsx" "*.go" "*.java" "*.rb" "*.php" \
            > /tmp/aegisdiff_pr.diff 2>/dev/null || true

          if [ ! -s /tmp/aegisdiff_pr.diff ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "diff_lines=$(wc -l < /tmp/aegisdiff_pr.diff)" >> "$GITHUB_OUTPUT"
          fi

      - name: Get OIDC token for ingest auth
        id: oidc
        run: |
          OIDC_TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=aegisdiff" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          echo "token=$OIDC_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run AegisDiff triage
        if: steps.diff.outputs.skip == 'false'
        continue-on-error: true   # Never block CI on triage failure
        env:
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:          ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2:        ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3:        ${{ secrets.GROQ_API_KEY_3 }}
          GITHUB_TOKEN:          ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER:             ${{ github.event.pull_request.number || '' }}
          COMMIT_SHA:            ${{ github.sha }}
          REPO:                  ${{ github.repository }}
          DIFF_PATH:             /tmp/aegisdiff_pr.diff
          AEGISDIFF_INGEST_URL:  ${{ secrets.AEGISDIFF_INGEST_URL }}
          AEGISDIFF_REPO_TOKEN:  ${{ steps.oidc.outputs.token }}
        run: python -m aegisdiff.entrypoint

      - name: Write step summary
        if: always() && steps.diff.outputs.skip == 'false'
        run: |
          echo "### AegisDiff Self-Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Diff lines:** ${{ steps.diff.outputs.diff_lines || 0 }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/step_summary.md ]; then
            cat /tmp/step_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
