name: AegisDiff — GitHub App Analysis

# Triggered by the Vercel webhook handler when a PR is opened/updated
# on a repo where the AegisDiff GitHub App is installed.
#
# This workflow runs on OUR repo using OUR API keys — users supply
# zero secrets.  Analysis results are posted back to their PR via
# the GitHub App installation token.

on:
  repository_dispatch:
    types: [analyze_pr]

# SARIF upload to GitHub Code Scanning uses the GitHub App installation token.
# The App needs the `security_events` permission enabled in its GitHub App settings.
# See: https://github.com/settings/apps/<your-app> → Permissions → Security Events → Read & Write

jobs:
  analyze:
    name: Triage PR diff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout AegisDiff engine
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install engine + GitHub App dependencies
        run: pip install -e ".[dev]" "PyJWT[cryptography]"

      - name: Run triage engine
        env:
          # GitHub App credentials (our secrets — never user-supplied)
          GITHUB_APP_ID:           ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY:  ${{ secrets.GITHUB_APP_PRIVATE_KEY }}

          # Error tracking (optional — no-ops if not set)
          SENTRY_DSN:              ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT:      production

          # LLM providers (our secrets — keys rotate on 429/404)
          # GitHub Models (GITHUB_TOKEN) is auto-injected as zero-config fallback.
          OPENROUTER_API_KEY:      ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2:    ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY_3:    ${{ secrets.OPENROUTER_API_KEY_3 }}

          # Target PR context (passed from webhook via client_payload)
          INSTALLATION_ID: ${{ github.event.client_payload.installation_id }}
          TARGET_REPO:     ${{ github.event.client_payload.repo }}
          PR_NUMBER:       ${{ github.event.client_payload.pr_number }}
          COMMIT_SHA:      ${{ github.event.client_payload.head_sha }}

          # Dashboard ingest (per-repo token forwarded from webhook)
          AEGISDIFF_INGEST_URL:   ${{ github.event.client_payload.ingest_url }}
          AEGISDIFF_INGEST_TOKEN: ${{ github.event.client_payload.ingest_token }}
        run: python -m aegisdiff.app_entrypoint

      - name: Write step summary
        if: always()
        run: |
          if [ -f /tmp/step_summary.md ]; then
            cat /tmp/step_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
