name: AegisDiff — Analyze PR (GitHub App)

# Triggered by the Vercel webhook handler when a PR is opened on any
# repo that has the AegisDiff GitHub App installed.
# The webhook fires a repository_dispatch to this repo with the target
# repo, PR number, head SHA, and ingest token in client_payload.
on:
  repository_dispatch:
    types: [analyze_pr]

# Minimal permissions — this workflow only reads AegisDiff engine code.
# PR comments are posted via AEGISDIFF_ENGINE_TOKEN (a PAT with repo scope
# on the target repo).
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ github.event.client_payload.repo }}#${{ github.event.client_payload.pr_number }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Checkout the AegisDiff engine ─────────────────────────────────
      - name: Checkout AegisDiff engine
        uses: actions/checkout@v4

      # ── 2. Python setup ───────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install engine ─────────────────────────────────────────────────
      - name: Install AegisDiff
        run: |
          pip install --quiet \
            httpx>=0.27 \
            tree-sitter-languages>=1.10
          pip install --quiet -e .

      # ── 4. Fetch diff from the target repo ───────────────────────────────
      - name: Fetch PR diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.AEGISDIFF_ENGINE_TOKEN }}
          TARGET_REPO: ${{ github.event.client_payload.repo }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
        run: |
          echo "Fetching diff for ${TARGET_REPO}#${PR_NUMBER}"

          HTTP_STATUS=$(curl -fsSL \
            -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.diff" \
            "https://api.github.com/repos/${TARGET_REPO}/pulls/${PR_NUMBER}" \
            -o /tmp/aegisdiff_pr.diff 2>/dev/null || echo "000")

          echo "GitHub API status: ${HTTP_STATUS}"

          if [ ! -s /tmp/aegisdiff_pr.diff ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No diff found — skipping analysis"
          else
            DIFF_LINES=$(wc -l < /tmp/aegisdiff_pr.diff)
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "diff_lines=${DIFF_LINES}" >> "$GITHUB_OUTPUT"
            echo "Diff: ${DIFF_LINES} lines"
          fi

      # ── 5. Run security triage ────────────────────────────────────────────
      - name: Run AegisDiff triage
        if: steps.diff.outputs.skip == 'false'
        env:
          CEREBRAS_API_KEY:     ${{ secrets.CEREBRAS_API_KEY }}
          CEREBRAS_API_KEY_2:   ${{ secrets.CEREBRAS_API_KEY_2 }}
          CEREBRAS_API_KEY_3:   ${{ secrets.CEREBRAS_API_KEY_3 }}
          OPENROUTER_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          # Use the engine PAT — needs read+write on the target repo
          GITHUB_TOKEN:     ${{ secrets.AEGISDIFF_ENGINE_TOKEN }}
          PR_NUMBER:       ${{ github.event.client_payload.pr_number }}
          COMMIT_SHA:      ${{ github.event.client_payload.head_sha }}
          REPO:            ${{ github.event.client_payload.repo }}
          DIFF_PATH:       /tmp/aegisdiff_pr.diff
          AEGISDIFF_INGEST_URL:    ${{ github.event.client_payload.ingest_url }}
          AEGISDIFF_REPO_TOKEN:   ${{ github.event.client_payload.ingest_token }}
        run: python -m aegisdiff.entrypoint

      # ── 6. Step summary ───────────────────────────────────────────────────
      - name: Write step summary
        if: always()
        run: |
          echo "### AegisDiff Results" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Target:** \`${{ github.event.client_payload.repo }}#${{ github.event.client_payload.pr_number }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Diff lines:** ${{ steps.diff.outputs.diff_lines || 0 }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/step_summary.md ]; then
            cat /tmp/step_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
