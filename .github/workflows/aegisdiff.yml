name: AegisDiff — AppSec Triage

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      # Only trigger on source code changes — not docs, CI configs, or assets
      - "**.py"
      - "**.js"
      - "**.ts"
      - "**.tsx"
      - "**.jsx"
      - "**.go"
      - "**.java"
      - "**.rb"
      - "**.php"

  workflow_dispatch: {}
  # push:                        # OPTIONAL: uncomment for public repos (unlimited minutes)
  #   branches: [main, master, develop]
  #   paths:
  #     - "**.py"
  #     - "**.js"
  #     - "**.ts"

# Minimal permissions — read code, write PR comments only
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  appsec-triage:
    name: Security Triage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Checkout with full history for accurate diff ─────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history required for cross-commit diff

      # ── 2. Set up Python with pip cache ─────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install AegisDiff engine ──────────────────────────────────────
      - name: Install AegisDiff
        run: |
          pip install --quiet \
            httpx>=0.27 \
            tree-sitter-languages>=1.10
          pip install --quiet -e .

      # ── 4. Generate diff ─────────────────────────────────────────────────
      - name: Generate diff
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            # push or workflow_dispatch: diff against parent commit
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.event.after || github.sha }}"
          fi

          # Only diff source code files
          timeout 60 git diff "${BASE_SHA}...${HEAD_SHA}" \
            -- "*.py" "*.js" "*.ts" "*.tsx" "*.jsx" "*.go" "*.java" "*.rb" "*.php" \
            > /tmp/aegisdiff_pr.diff 2>/dev/null || true

          DIFF_LINES=$(wc -l < /tmp/aegisdiff_pr.diff || echo 0)

          if [ ! -s /tmp/aegisdiff_pr.diff ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "diff_lines=0" >> "$GITHUB_OUTPUT"
            echo "### AegisDiff" >> "$GITHUB_STEP_SUMMARY"
            echo "No source code changes detected — skipping analysis." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "diff_lines=${DIFF_LINES}" >> "$GITHUB_OUTPUT"
          fi

      # ── 5. Run AegisDiff triage ──────────────────────────────────────────
      - name: Run AegisDiff triage
        if: steps.diff.outputs.skip == 'false'
        id: triage
        env:
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2:  ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3:  ${{ secrets.GROQ_API_KEY_3 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          DIFF_PATH: /tmp/aegisdiff_pr.diff
          AEGISDIFF_INGEST_URL: ${{ secrets.AEGISDIFF_INGEST_URL }}
          AEGISDIFF_REPO_TOKEN: ${{ secrets.AEGISDIFF_REPO_TOKEN }}
          AEGISDIFF_GIST_ID: ${{ secrets.AEGISDIFF_GIST_ID }}
        run: |
          python -m aegisdiff.entrypoint

      # ── 6. Append step summary ───────────────────────────────────────────
      - name: Write step summary
        if: always()
        run: |
          echo "### AegisDiff Results" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Diff lines analyzed:** ${{ steps.diff.outputs.diff_lines || 0 }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/step_summary.md ]; then
            cat /tmp/step_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
